
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ReviveX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>ReviveX</h1>
        <p>Bring abandoned projects back to life.</p>
    </header>

    <main>
        <section class="auth-card">
            <h2>Create Your Account</h2>
            <p>Start bringing unfinished projects back to life.</p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="flash-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label for="username">Username</label>
                <input id="username" name="username" required minlength="3" maxlength="40">

                <label for="email">Email</label>
                <input id="email" type="email" name="email" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" required minlength="8">

                <button type="submit">Create Account</button>
            </form>

            <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
            <a href="{{ url_for('home') }}">Back to Home</a>
        </section>
    </main>
</body>
</html>
